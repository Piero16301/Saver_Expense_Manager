name: saver_expense_manager
description: App to manage expenses
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.35.6"

dependencies:
  bloc: ^9.2.0
  cloud_firestore: ^6.1.1
  cunning_document_scanner: ^1.4.0 # Sólo para Android e iOS
  equatable: ^2.0.8
  file_picker: ^10.3.8
  firebase_ai: ^3.6.1
  firebase_app_check: ^0.4.1
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_pagination: ^4.2.0
  firebase_storage: ^13.0.5
  firebase_ui_auth: ^3.0.1
  firebase_ui_localizations: ^2.0.1
  firebase_ui_oauth: ^2.0.1
  firebase_ui_oauth_google: ^2.0.1
  firebase_ui_storage: ^3.0.1 # No compatible con web
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.1
  google_fonts: ^7.0.0
  hugeicons: ^1.1.4
  intl: ^0.20.2
  mat_month_picker_dialog: ^1.1.3
  mime: ^2.0.0
  open_file: ^3.5.10
  path_provider: ^2.1.5 # No compatible con web
  rive: ^0.14.0
  shared_preferences: ^2.5.4
  syncfusion_flutter_charts: ^32.1.21
  syncfusion_flutter_core: ^32.1.21
  user_api:
    path: packages/user_api
  user_api_remote:
    path: packages/user_api_remote
  user_repository:
    path: packages/user_repository
  uuid: ^4.5.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  test_coverage_badge: ^0.3.2
  very_good_analysis: ^10.0.0

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app-main-logo-rounded.png"
  adaptive_icon_background: "#2C6C41"
  adaptive_icon_foreground: "assets/images/app-main-logo-rounded.png"
  ios: true
  image_path_ios: "assets/images/app-main-logo-rounded.png"
  remove_alpha_ios: true
  background_color_ios: "#2C6C41"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SocialIcons
      fonts:
        - asset: packages/firebase_ui_auth/fonts/SocialIcons.ttf

  assets:
    - assets/animations/
    - assets/images/
