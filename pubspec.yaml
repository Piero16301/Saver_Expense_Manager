name: saver_expense_manager
description: App to manage expenses
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  bloc: ^9.2.1
  cloud_firestore: ^7.1.0
  country_flags: ^4.1.2
  cunning_document_scanner: ^3.0.4
  equatable: ^3.0.0
  expressive_kit: ^0.0.7
  file_picker: ^13.3.0
  firebase_ai: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_performance: ^0.12.1
  firebase_remote_config: ^7.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  gemini_nano_android: ^1.2.1
  get_it: ^9.3.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  hugeicons: ^1.2.0
  intl: ^0.20.3
  material_ui: ^1.8.0
  mime: ^2.1.0
  open_file: ^4.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  syncfusion_flutter_charts: ^35.1.42
  syncfusion_flutter_core: ^35.1.42
  uuid: ^4.6.0
  web: ^1.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  network_image_mock: ^2.1.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app-main-logo-rounded.png"
  adaptive_icon_background: "#2C6C41"
  adaptive_icon_foreground: "assets/images/app-main-logo-rounded.png"
  ios: true
  image_path_ios: "assets/images/app-main-logo-rounded.png"
  remove_alpha_ios: true
  background_color_ios: "#2C6C41"
  web:
    generate: true
    image_path: "assets/images/app-main-logo-web.png"
    background_color: "transparent"
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/logos/
    - .env
