name: saver_expense_manager
description: App to manage expenses
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  bloc: ^9.0.1
  cloud_firestore: ^6.0.2
  cunning_document_scanner: ^1.3.1
  equatable: ^2.0.7
  file_picker: ^10.3.3
  firebase_app_check: ^0.4.1
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_pagination: ^4.2.0
  firebase_storage: ^13.0.2
  firebase_ui_auth: ^3.0.0
  firebase_ui_localizations: ^2.0.0
  firebase_ui_oauth: ^2.0.0
  firebase_ui_oauth_google: ^2.0.0
  firebase_ui_storage: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  go_router: ^16.2.4
  google_fonts: ^6.3.2
  google_generative_ai: ^0.4.7
  intl: ^0.20.2
  mat_month_picker_dialog: ^1.1.3
  mime: ^2.0.0
  open_file: ^3.5.10
  path_provider: ^2.1.5
  rive: ^0.13.20
  shared_preferences: ^2.5.3
  syncfusion_flutter_charts: ^31.1.22
  syncfusion_flutter_core: ^31.1.22
  user_api:
    path: packages/user_api
  user_api_remote:
    path: packages/user_api_remote
  user_repository:
    path: packages/user_repository
  uuid: ^4.5.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter_icons:
  image_path: "assets/images/logo.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SocialIcons
      fonts:
        - asset: packages/firebase_ui_auth/fonts/SocialIcons.ttf

  assets:
    - .env
    - assets/animations/
    - assets/images/
