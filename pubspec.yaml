name: saver_expense_manager
description: App to manage expenses
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.35.6"

dependencies:
  bloc: ^9.2.0
  cloud_firestore: ^6.1.2
  cunning_document_scanner: ^1.4.0
  equatable: ^2.0.8
  file_picker: ^10.3.10
  firebase_ai: ^3.8.0
  firebase_analytics: ^12.1.2
  firebase_app_check: ^0.4.1
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_pagination: ^4.2.0
  firebase_remote_config: ^6.1.4
  firebase_storage: ^13.0.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  gemini_nano_android: ^1.0.1
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  google_sign_in: ^7.2.0
  hugeicons: ^1.1.5
  intl: ^0.20.2
  mat_month_picker_dialog: ^1.1.3
  mime: ^2.0.0
  open_file: ^3.5.11
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  rive: ^0.14.3
  shared_preferences: ^2.5.4
  syncfusion_flutter_charts: ^32.2.7
  syncfusion_flutter_core: ^32.2.7
  uuid: ^4.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  fake_cloud_firestore: ^4.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1
  very_good_analysis: ^10.2.0

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app-main-logo-rounded.png"
  adaptive_icon_background: "#2C6C41"
  adaptive_icon_foreground: "assets/images/app-main-logo-rounded.png"
  ios: true
  image_path_ios: "assets/images/app-main-logo-rounded.png"
  remove_alpha_ios: true
  background_color_ios: "#2C6C41"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
    - .env
